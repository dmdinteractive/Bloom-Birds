<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bloom Birds Panel</title>
<link rel="stylesheet" href="/static/panel.css">
<script src="/static/rotate.js"></script>
</head>
<body>
<div class="panel-app">

  <header class="top">
    <div class="brand"><span class="appmark" aria-hidden="true"></span><span>Bloom <b>Birds</b></span></div>
    <div class="lights" id="lights"></div>
    <button class="big svc" id="btnService" aria-pressed="false">Service</button>
    <button class="big stop" id="btnStop"><span class="sq"></span>STOP ALL</button>
  </header>

  <main class="content" style="position:relative">
    <!-- RUN: the only screen needed day to day -->
    <section class="view active" id="v-run">
      <div class="run3">
        <div class="box">
          <div class="state" id="state">—</div>
          <div class="state-sub" id="stateSub"></div>
          <div class="cmds">
            <button class="big run" data-cmd="run"><span class="gl">▶</span>Run</button>
            <button class="big" data-cmd="hold"><span class="gl">||</span>Hold</button>
            <button class="big" data-cmd="park"><span class="gl">↑</span>Park at top</button>
          </div>
        </div>
        <div class="box">
          <div class="box-h">Birds <span class="h-note">mm of cable below the top</span></div>
          <canvas id="gauges" aria-label="Height of every bird"></canvas>
        </div>
        <div class="box">
          <div class="knobs" id="knobs"></div>
          <button class="mid wide" id="btnFastest">Set to fastest the motors can do</button>
          <div class="fit-line" id="fit"></div>
        </div>
      </div>
    </section>

    <!-- SERVICE: setting up birds, the log, turning the screen -->
    <section class="view" id="v-service">
      <div class="svc-grid">
        <div class="box">
          <div class="box-h">Birds</div>
          <div class="bird-list" id="birdList"></div>
          <div class="svc-btns">
            <button class="mid" id="btnAdd">Add a bird…</button>
            <button class="mid" id="btnRotate">Flip screen upside down</button>
          </div>
          <p class="hint" id="addr"></p>
        </div>
        <div class="box">
          <div class="box-h">Event Log</div>
          <div class="log" id="log"></div>
        </div>
      </div>
    </section>
    <div class="offline" id="offline" hidden>Controller not responding. Reconnecting…</div>
  </main>

  <footer class="status">
    <span id="stState">Connecting…</span>
    <span id="stException" class="exc">No faults</span>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/panel.js"></script>
</body>
</html>
